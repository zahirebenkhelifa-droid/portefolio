<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a2e">
  <title>Mon profil — Zahire Benkhelifa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#101a2e;
      --bg-alt:#16213a;
      --line:#33415c;
      --paper:#f2eedf;
      --ink:#e9e4d4;
      --ink-soft:#a8b0c2;
      --ink-faint:#6b7690;
      --copper:#d98e4a;
      --pcb:#6fbf8b;
      --radius:3px;
    }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.65 'IBM Plex Mono',monospace;}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:repeating-linear-gradient(to right,rgba(233,228,212,.045) 0 1px,transparent 1px 88px),repeating-linear-gradient(to bottom,rgba(233,228,212,.045) 0 1px,transparent 1px 88px);}
    a{color:var(--copper);}
    h1,h2,p{margin:0;}
    h1,h2{font-family:'Fraunces',serif;font-weight:500;color:var(--paper);}
    .topbar{position:relative;z-index:1;border-bottom:1px solid var(--line);background:rgba(16,26,46,.94);}
    .topbar-inner{max-width:960px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
    .brand{color:var(--paper);font-family:'Fraunces',serif;text-decoration:none;}
    .brand span{color:var(--copper);}
    .top-actions{display:flex;align-items:center;gap:18px;font-size:.8rem;}
    .top-actions a{text-decoration:none;}
    .top-actions button{padding:0;border:0;background:none;color:var(--ink-soft);font:inherit;cursor:pointer;}
    .page{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:72px 24px 96px;}
    .eyebrow{color:var(--pcb);font-size:.75rem;text-transform:uppercase;}
    h1{margin-top:10px;font-size:2.4rem;line-height:1.15;}
    .intro{margin-top:12px;color:var(--ink-soft);font-size:.9rem;}
    .profile-form{margin-top:38px;display:grid;gap:22px;}
    .profile-form[hidden]{display:none;}
    .field{display:grid;gap:7px;color:var(--ink-soft);font-size:.8rem;}
    .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--bg-alt);color:var(--ink);font:inherit;font-size:.9rem;}
    .field textarea{min-height:150px;resize:vertical;}
    .field input:focus,.field textarea:focus{outline:2px solid var(--copper);outline-offset:1px;}
    .field input[readonly]{color:var(--ink-faint);}
    .field-hint{color:var(--ink-faint);font-size:.7rem;}
    .actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
    .save-button{min-height:44px;padding:10px 18px;border:1px solid var(--copper);border-radius:var(--radius);background:var(--copper);color:#1a1206;font:600 .82rem 'IBM Plex Mono',monospace;cursor:pointer;}
    .save-button:disabled{opacity:.65;cursor:wait;}
    .status{min-height:1.5em;color:var(--pcb);font-size:.78rem;}
    .status[data-error="true"]{color:#ef9b91;}
    .created-at{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.74rem;}
    @media(max-width:560px){
      .topbar-inner{padding:14px 18px;}
      .top-actions{gap:12px;font-size:.72rem;}
      .page{padding:52px 18px 72px;}
      h1{font-size:2rem;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./index.html">Zahire Benkhelifa <span>/ Code09</span></a>
      <nav class="top-actions" aria-label="Navigation du compte">
        <a href="./index.html">Portfolio</a>
        <button id="sign-out" type="button">Déconnexion</button>
      </nav>
    </div>
  </header>
  <main class="page">
    <p class="eyebrow">Espace personnel</p>
    <h1>Mon profil</h1>
    <p class="intro">Ces informations sont enregistrées dans votre compte et ne sont visibles que par vous.</p>
    <form class="profile-form" id="profile-form" hidden>
      <label class="field">
        Adresse e-mail
        <input id="profile-email" type="email" readonly>
      </label>
      <label class="field">
        Nom affiché
        <input id="display-name" name="display_name" type="text" maxlength="80" autocomplete="name" required>
      </label>
      <label class="field">
        Présentation
        <textarea id="bio" name="bio" maxlength="600" placeholder="Quelques mots à propos de vous"></textarea>
        <span class="field-hint">600 caractères maximum</span>
      </label>
      <label class="field">
        Site web
        <input id="website" name="website" type="url" maxlength="300" placeholder="https://exemple.fr" autocomplete="url">
      </label>
      <div class="actions">
        <button class="save-button" id="save-profile" type="submit">Enregistrer le profil</button>
        <p class="status" id="profile-status" role="status" aria-live="polite"></p>
      </div>
      <p class="created-at" id="created-at"></p>
    </form>
    <p class="status" id="page-status" role="status" aria-live="polite">Chargement du profil…</p>
  </main>
  <script type="module" src="profile.mjs"></script>
</body>
</html>
